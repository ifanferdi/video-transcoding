services:
  postgres:
    image: postgres:17-alpine
    container_name: video-transcoding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_transcoding
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - video-transcoding
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: video-transcoding-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - video-transcoding
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: video-transcoding-minio
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9001:9000' # S3 API
      - '9003:9002' # console UI
    volumes:
      - minio_data:/data
    networks:
      - video-transcoding
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: video-transcoding-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - video-transcoding
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/video-transcoding &&
      mc anonymous set download local/video-transcoding &&
      echo 'MinIO bucket ready';
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-transcoding-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_NAME: 'Video Transcoding API'
      APP_VERSION: 1.0.0
      APP_ENV: production
      APP_PORT: 8100
      APP_URL: http://localhost:8100
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/video_transcoding
      REDIS_URL: redis://redis:6379
      REDIS_TTL_SECONDS: 21600
      FILESYSTEM: s3
      S3_REGION: us-east-1
      S3_ACCESS: minioadmin
      S3_SECRET: minioadmin
      # Endpoint internal container (bukan localhost — diakses dari dalam network)
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9001
      S3_BUCKET: video-transcoding
      UPLOAD_SINGLE_MAX_SIZE: 1073741824
      UPLOAD_MULTIPART_THRESHOLD: 104857600
      UPLOAD_MULTIPART_CHUNK_SIZE: 10485760
      UPLOAD_PRESIGN_EXPIRES: 3600
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '8100:8100'
    networks:
      - video-transcoding

networks:
  video-transcoding:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
